plugins {
    id 'com.android.application' version '8.13.0'
}

/**
 * Where `mobile/scripts/fetch-libnode.mjs` unpacked the nodejs-mobile release:
 * `bin/<abi>/libnode.so` plus `include/node`. Declared before the android block
 * because that block's closures read it during configuration.
 *
 * `rootDir` here is `mobile/android`, so one level up is `mobile/` — which is
 * where the fetch script writes by default. CI sets LIBNODE_DIR explicitly so
 * the two can never drift apart again.
 */
def libnodeDir = file(System.getenv('LIBNODE_DIR') ?: "$rootDir/../build/libnode").absolutePath

/**
 * Narrow the packaged ABIs: `-PabiFilters=arm64-v8a` (default) or `all`.
 *
 * Deliberately not named `abiFilters`: inside the `ndk { }` block below, a
 * local variable of that name shadows the `abiFilters` method that block wants
 * to call, and Gradle then reports "No signature of method:
 * java.util.ArrayList.call()".
 */
def requestedAbis = (project.findProperty('abiFilters') ?: 'arm64-v8a')
        .split(',')
        .collect { it.trim() }
        .findAll { !it.isEmpty() }
// `all` is a shorthand, not an ABI name: expand it to every one nodejs-mobile
// ships. Leaving the literal in would make AGP look for a nonexistent ABI and
// silently package none.
if (requestedAbis == ['all']) {
    requestedAbis = ['arm64-v8a', 'armeabi-v7a', 'x86_64']
}

/** Signing comes from the environment; absent locally, present on CI. */
def keystorePath = System.getenv('OPENMAIC_KEYSTORE_PATH')

android {
    namespace 'ai.openmaic.mobile'
    compileSdk 36
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'ai.openmaic.mobile'
        minSdk 24
        targetSdk 36
        // The build identifies itself so an update check can tell whether the
        // release it is looking at is newer than what is installed. CI passes
        // the tag (`v1.0.0-m11`) and a monotonic code; without them a local
        // build reports the values below and the check simply never offers
        // anything newer.
        versionCode(providers.environmentVariable('OPENMAIC_VERSION_CODE').orNull?.toInteger() ?: 1)
        versionName(providers.environmentVariable('OPENMAIC_VERSION_NAME').orNull ?: '1.0.0')
        ndk {
            // Each libnode.so is ~85 MB, so the default build carries one ABI.
            // `-PabiFilters=all` packages every one the runtime ships.
            abiFilters(*requestedAbis)
        }
        externalNativeBuild {
            cmake {
                arguments "-DLIBNODE_DIR=${libnodeDir}", '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            // payload.zip, written by mobile/scripts/assemble-payload.mjs.
            // NodePayload inflates it into private storage on first launch; it
            // is not something the WebView loads, so it is not a web asset.
            assets.srcDirs += ['src/main/assets']
        }
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('OPENMAIC_KEYSTORE_PASSWORD')
                keyAlias System.getenv('OPENMAIC_KEY_ALIAS')
                keyPassword System.getenv('OPENMAIC_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (keystorePath) {
                // An unsigned release APK cannot be installed, so CI fails
                // earlier if the secret is missing rather than shipping one.
                signingConfig signingConfigs.release
            }
        }
    }

    packaging {
        jniLibs {
            // libnode.so is dlopened straight out of the APK. Storing native
            // libraries uncompressed is what lets the loader mmap them (and
            // what keeps them 16 KB page aligned on Android 15+).
            useLegacyPackaging = false
        }
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/*.version']
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    lint {
        // The payload is opaque to lint, and the wrapper's own warnings are not
        // worth failing a release build over.
        abortOnError false
    }
}

/** Fail before a long native build if the runtime was never fetched. */
tasks.register('checkLibnode') {
    doLast {
        def so = new File(libnodeDir, 'bin/arm64-v8a/libnode.so')
        if (!so.exists()) {
            throw new GradleException(
                    "libnode.so is missing at ${so}.\n" +
                    "Run `node mobile/scripts/fetch-libnode.mjs` first.")
        }
    }
}

tasks.matching {
    it.name.startsWith('configureCMake') ||
            it.name.startsWith('buildCMake') ||
            it.name.startsWith('externalNativeBuild')
}.configureEach {
    dependsOn 'checkLibnode'
}

/** Fail loudly when the payload is missing, rather than shipping an empty app. */
tasks.register('checkPayload') {
    doLast {
        def zip = file('src/main/assets/payload.zip')
        if (!zip.exists() || zip.length() < 10_000_000) {
            throw new GradleException(
                    "src/main/assets/payload.zip is missing or too small (${zip.exists() ? zip.length() : 0} bytes).\n" +
                    "Run `node mobile/scripts/assemble-payload.mjs --out mobile/android/app/src/main/assets/payload.zip` first.")
        }
        println "payload.zip: ${(zip.length() / 1048576).round()} MB"
    }
}

tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach {
    dependsOn 'checkPayload'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.webkit:webkit:1.14.0'
}

/**
 * Pin the Kotlin standard library.
 *
 * androidx.webkit pulls kotlin-stdlib 1.8.x while something else in the graph
 * still asks for kotlin-stdlib-jdk7/jdk8 1.6.x, and since Kotlin 1.8 those
 * jdk-specific artifacts' classes moved *into* the main stdlib — so both on the
 * classpath is a hard duplicate-class error, not a version warning. Forcing
 * the whole family onto one resolved version is the standard resolution.
 */
configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.0.21'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.0.21'
    }
}
