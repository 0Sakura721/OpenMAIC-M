plugins {
    id 'com.android.application' version '8.13.0'
}

android {
    namespace 'ai.openmaic.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'ai.openmaic.mobile'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        ndk {
            // nodejs-mobile ships these three; x86_64 is what an emulator needs.
            // `-PabiFilters=arm64-v8a` narrows it: each libnode.so is ~85 MB, so
            // a single-ABI APK is a quarter of the size and installs far faster.
            def requested = (project.findProperty('abiFilters') ?: 'arm64-v8a,armeabi-v7a,x86_64')
                    .split(',').collect { it.trim() }.findAll { !it.isEmpty() }
            abiFilters(*requested)
        }
        externalNativeBuild {
            cmake {
                arguments "-DLIBNODE_DIR=${libnodeDir}", '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            // The Node payload is generated by mobile/scripts/assemble-payload.mjs
            // and unpacked to app storage on first launch. It is not an asset
            // the WebView loads, so it lives in its own directory rather than
            // under the default `assets/`.
            assets.srcDirs += ['src/main/assets', "$buildDir/generated/node-assets"]
            jniLibs.srcDirs += ['src/main/jniLibs']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signing comes from the CI environment; see mobile/android/README.md.
            if (System.getenv('OPENMAIC_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }

    signingConfigs {
        release {
            def storePath = System.getenv('OPENMAIC_KEYSTORE_PATH')
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv('OPENMAIC_KEYSTORE_PASSWORD')
                keyAlias System.getenv('OPENMAIC_KEY_ALIAS')
                keyPassword System.getenv('OPENMAIC_KEY_PASSWORD')
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    packagingOptions {
        jniLibs {
            // libnode.so is dlopened from the APK's lib directory by the
            // platform linker, so it must be stored uncompressed and page
            // aligned; extractNativeLibs below is what makes that possible.
            useLegacyPackaging = false
        }
    }

    buildFeatures {
        buildConfig true
    }
}

/**
 * The directory the nodejs-mobile release zip is unpacked into, populated by
 * `mobile/scripts/fetch-libnode.mjs` before Gradle runs.
 */
def libnodeDir = file("$rootDir/../../build/libnode").absolutePath

tasks.register('checkLibnode') {
    doLast {
        def so = file("${libnodeDir}/bin/arm64-v8a/libnode.so")
        if (!so.exists()) {
            throw new GradleException(
                "libnode.so is missing at ${so}. Run `node mobile/scripts/fetch-libnode.mjs` first.")
        }
    }
}

tasks.matching { it.name.startsWith('configureCMake') || it.name.startsWith('buildCMake') || it.name.startsWith('externalNativeBuild') }.configureEach {
    dependsOn 'checkLibnode'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.webkit:webkit:1.14.0'
}
