name: APK

# Builds the Android app and uploads an installable release APK.
#
# Two separate things are compiled, and they cost very different amounts:
#   - the web app (Next.js standalone) — a full production build of the whole
#     repository, minutes of CPU and several GB of RAM;
#   - the Android shell — Gradle + NDK, linking the JNI shim against libnode.so.
#
# Neither runs on a laptop here: everything is done on GitHub's runners, and the
# resulting APK comes back as an artifact (and, for a tag, a Release asset).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      abi:
        description: 'Which ABIs to package'
        type: choice
        options:
          - arm64-v8a
          - all
        default: arm64-v8a

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Node 22 is what the repository's engines field and CI use; the device
  # runtime is Node 24 (see mobile/scripts/fetch-libnode.mjs), and the server
  # bundle is plain JS so the two do not have to match.
  NODE_VERSION: '22'

jobs:
  web:
    name: Build the Node payload
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # pnpm comes from package.json's `packageManager` field via corepack —
      # the same route the repository's own CI takes. Passing a version here as
      # well makes pnpm/action-setup fail on the mismatch.
      - name: Enable the repository's pnpm
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Next.js standalone server
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          # The standalone server reads these at build time; the mobile startup
          # script overrides DATABASE_URL at runtime.
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Verify the PGlite-backed pg replacement boots the server
        run: node mobile/scripts/verify-runtime.mjs

      - name: Assemble the Android payload
        run: node mobile/scripts/assemble-payload.mjs --out "$RUNNER_TEMP/payload.zip"

      - name: Report payload size
        run: ls -lh "$RUNNER_TEMP/payload.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: node-payload
          path: ${{ runner.temp }}/payload.zip
          retention-days: 7
          compression-level: 0

  apk:
    name: Build the APK
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The runner image ships cmdline-tools somewhere under ANDROID_SDK_ROOT.
      # `android-actions/setup-android` is not used: its bundled `tools` package
      # has been withdrawn from Google's repository, so the action fails.
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          CMDLINE="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | sort -V | tail -1)"
          if [ -z "$CMDLINE" ]; then
            echo "::error::no cmdline-tools under $SDK"; ls -la "$SDK" || true; exit 1
          fi
          export PATH="$CMDLINE:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_NDK_HOME=$SDK/ndk/27.2.12479018"
          } >> "$GITHUB_ENV"

      - name: Fetch the Node.js Android runtime
        run: node mobile/scripts/fetch-libnode.mjs

      - uses: actions/download-artifact@v4
        with:
          name: node-payload
          # The app inflates assets/payload.zip into private storage on first
          # launch; the entry name is what NodePayload looks for.
          path: mobile/android/app/src/main/assets

      - name: Restore the signing keystore
        env:
          OPENMAIC_KEYSTORE_BASE64: ${{ secrets.OPENMAIC_KEYSTORE_BASE64 }}
          OPENMAIC_KEYSTORE_PASSWORD: ${{ secrets.OPENMAIC_KEYSTORE_PASSWORD }}
          OPENMAIC_KEY_ALIAS: ${{ secrets.OPENMAIC_KEY_ALIAS }}
          OPENMAIC_KEY_PASSWORD: ${{ secrets.OPENMAIC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${OPENMAIC_KEYSTORE_BASE64:-}" ]; then
            # An unsigned release APK cannot be installed, so a green build
            # that produces one is worse than a red build that says why.
            echo "::error::OPENMAIC_KEYSTORE_BASE64 is not set; the release APK would be unsigned."
            exit 1
          fi
          printf '%s' "$OPENMAIC_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/openmaic.jks"
          chmod 600 "$RUNNER_TEMP/openmaic.jks"
          {
            echo "OPENMAIC_KEYSTORE_PATH=$RUNNER_TEMP/openmaic.jks"
            echo "OPENMAIC_KEYSTORE_PASSWORD=$OPENMAIC_KEYSTORE_PASSWORD"
            echo "OPENMAIC_KEY_ALIAS=$OPENMAIC_KEY_ALIAS"
            echo "OPENMAIC_KEY_PASSWORD=$OPENMAIC_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the release APK
        working-directory: mobile/android
        run: |
          set -euo pipefail
          ABI="${{ inputs.abi || 'arm64-v8a' }}"
          if [ "$ABI" = "all" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            # One ABI keeps the APK installable-sized: each libnode.so is ~85 MB.
            ./gradlew --no-daemon assembleRelease -PabiFilters="$ABI"
          fi

      - name: Rename and verify the APK
        run: |
          set -euo pipefail
          APK="$(find mobile/android/app/build/outputs/apk/release -name '*.apk' | head -1)"
          [ -n "$APK" ] || { echo "::error::no APK produced"; exit 1; }
          OUT="OpenMAIC-M-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          cp "$APK" "$OUT"
          echo "APK=$OUT" >> "$GITHUB_ENV"
          ls -lh "$OUT"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: openmaic-m-apk
          path: ${{ env.APK }}
          retention-days: 30

      - name: Attach the APK to a Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" \
              --title "$GITHUB_REF_NAME" \
              --notes "OpenMAIC-M $GITHUB_REF_NAME — Android build with the embedded Node runtime and on-device PGlite database."
          fi
