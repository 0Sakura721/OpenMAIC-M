name: APK

# Builds the Android app and uploads an installable release APK.
#
# One job, not two. The web bundle and the APK shell are separate builds, but
# they exchange a ~160 MB payload, and staging that through an artifact is both
# slow and subject to the repository's artifact storage quota — which has
# already failed this workflow once with "Artifact storage quota has been hit".
# In a single job the payload is just a file on disk.
#
# Everything expensive runs here and nowhere else: a full Next.js production
# build plus Gradle and the NDK are minutes of CPU and several GB of RAM, which
# is exactly what a runner is for.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      abi:
        description: 'Which ABIs to package'
        type: choice
        options:
          - arm64-v8a
          - all
        default: arm64-v8a

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Node 22 is what the repository's engines field and CI use. The *device*
  # runtime is Node 24 (see mobile/scripts/fetch-libnode.mjs); the server bundle
  # is plain JavaScript, so the two do not have to match.
  NODE_VERSION: '22'
  # One ABI keeps the APK installable-sized: each libnode.so is ~85 MB.
  ABI: ${{ inputs.abi || 'arm64-v8a' }}
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: Build and sign the APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------- web

      # pnpm comes from package.json's `packageManager` field via corepack —
      # the same route the repository's own CI takes. It has to be enabled
      # before setup-node, because `cache: pnpm` shells out to `pnpm store path`
      # and fails when the binary is not on PATH yet.
      - name: Enable the repository's pnpm
        run: |
          corepack enable
          corepack install
          pnpm --version

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Next.js standalone server
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Assemble the Android payload
        run: node mobile/scripts/assemble-payload.mjs --out "$RUNNER_TEMP/payload.zip"

      # Runs against the packed archive, not the build tree, so it also proves
      # the payload is complete: a file the pruner dropped shows up here as a
      # module-not-found rather than as a crash on someone's phone. This is the
      # check that caught the missing pg-types, the missing data directory and
      # the missing @swc/helpers.
      - name: Verify the packed payload boots and can store a course
        run: node mobile/scripts/verify-runtime.mjs --payload "$RUNNER_TEMP/payload.zip"

      - name: Report payload size
        run: ls -lh "$RUNNER_TEMP/payload.zip"

      # -------------------------------------------------------------- android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner image ships cmdline-tools somewhere under ANDROID_SDK_ROOT.
      # `android-actions/setup-android` is not used: its bundled `tools` package
      # has been withdrawn from Google's repository, so the action fails.
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          CMDLINE="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | sort -V | tail -1)"
          if [ -z "$CMDLINE" ]; then
            echo "::error::no cmdline-tools under $SDK"; ls -la "$SDK" || true; exit 1
          fi
          export PATH="$CMDLINE:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_NDK_HOME=$SDK/ndk/27.2.12479018"
          } >> "$GITHUB_ENV"

      - name: Fetch the Node.js Android runtime
        run: node mobile/scripts/fetch-libnode.mjs

      - name: Place the payload where Gradle packages it
        run: |
          set -euo pipefail
          mkdir -p mobile/android/app/src/main/assets
          cp "$RUNNER_TEMP/payload.zip" mobile/android/app/src/main/assets/payload.zip

      - name: Restore the signing keystore
        env:
          OPENMAIC_KEYSTORE_BASE64: ${{ secrets.OPENMAIC_KEYSTORE_BASE64 }}
          OPENMAIC_KEYSTORE_PASSWORD: ${{ secrets.OPENMAIC_KEYSTORE_PASSWORD }}
          OPENMAIC_KEY_ALIAS: ${{ secrets.OPENMAIC_KEY_ALIAS }}
          OPENMAIC_KEY_PASSWORD: ${{ secrets.OPENMAIC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${OPENMAIC_KEYSTORE_BASE64:-}" ]; then
            # An unsigned release APK cannot be installed, so a green build that
            # produces one is worse than a red build that says why.
            echo "::error::OPENMAIC_KEYSTORE_BASE64 is not set; the release APK would be unsigned."
            exit 1
          fi
          printf '%s' "$OPENMAIC_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/openmaic.jks"
          chmod 600 "$RUNNER_TEMP/openmaic.jks"
          {
            echo "OPENMAIC_KEYSTORE_PATH=$RUNNER_TEMP/openmaic.jks"
            echo "OPENMAIC_KEYSTORE_PASSWORD=$OPENMAIC_KEYSTORE_PASSWORD"
            echo "OPENMAIC_KEY_ALIAS=$OPENMAIC_KEY_ALIAS"
            echo "OPENMAIC_KEY_PASSWORD=$OPENMAIC_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the release APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleRelease -PabiFilters="$ABI"

      - name: Rename and verify the APK
        run: |
          set -euo pipefail
          APK="$(find mobile/android/app/build/outputs/apk/release -name '*.apk' | head -1)"
          [ -n "$APK" ] || { echo "::error::no APK produced"; exit 1; }
          OUT="OpenMAIC-M-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          cp "$APK" "$OUT"
          echo "APK=$OUT" >> "$GITHUB_ENV"
          ls -lh "$OUT"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$OUT"

      # Artifacts are best-effort: this repository has exhausted its artifact
      # storage quota before, and that failure must not discard a working APK.
      - name: Upload the APK as an artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: openmaic-m-apk
          path: ${{ env.APK }}
          retention-days: 30

      - name: Attach the APK to a Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" \
              --title "$GITHUB_REF_NAME" \
              --notes "OpenMAIC-M $GITHUB_REF_NAME — Android build with the embedded Node runtime and on-device PGlite database."
          fi
